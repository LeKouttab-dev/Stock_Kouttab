# ---------------------------------------------------------------------------
# Construction des images, publication sur GHCR, déploiement sur le VPS.
#
# Secrets attendus (Settings → Secrets and variables → Actions) :
#   VPS_HOST         adresse du VPS
#   VPS_USER         utilisateur de déploiement (non-root)
#   VPS_SSH_KEY      clé privée ed25519 dédiée au déploiement
#   VPS_KNOWN_HOSTS  sortie de `ssh-keyscan <VPS_HOST>`
# Variable attendue :
#   SITE_DOMAIN      ex. stock.lekouttab.fr
#
# Le .env de production vit sur le VPS et n'est jamais lu ici.
# ---------------------------------------------------------------------------
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deux déploiements simultanés se marcheraient dessus (migrations comprises).
# `cancel-in-progress: false` : on laisse finir celui qui est en cours.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Construire et publier les images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      owner: ${{ steps.owner.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      # GHCR n'accepte que des noms en minuscules, or un compte GitHub peut
      # comporter des majuscules.
      - id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image API
        uses: docker/build-push-action@v6
        with:
          context: Gestion_stock_kouttab_react/backend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/kouttab-api:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.value }}/kouttab-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # VITE_API_URL est figé DANS le bundle à la construction : le front et
      # l'API partagent l'origine, d'où le chemin relatif.
      - name: Image Web
        uses: docker/build-push-action@v6
        with:
          context: Gestion_stock_kouttab_react/frontend
          push: true
          build-args: VITE_API_URL=/api/v1
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/kouttab-web:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.value }}/kouttab-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Le registre conserve une version par déploiement, et rien ne les
      # supprime : plusieurs dizaines s'y accumulaient, jusqu'au refus de
      # publication rencontré le 2026-08-12 (« denied: permission_denied »).
      # Les dix dernières suffisent largement pour un retour arrière.
      - name: Purger les anciennes images
        continue-on-error: true # un ménage raté ne doit pas bloquer un déploiement
        uses: actions/delete-package-versions@v5
        with:
          package-name: kouttab-api
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: false

      - name: Purger les anciennes images du front
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: kouttab-web
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: false

  deploy:
    name: Déployer sur le VPS
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Préparer la connexion SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Empreinte connue à l'avance : sans elle, on accepterait n'importe
          # quel serveur se présentant à cette adresse.
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Tirer les images et redémarrer
        run: |
          ssh -i ~/.ssh/deploy_key \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              "IMAGE_TAG='${{ github.sha }}' bash -s" <<'REMOTE'
          set -euo pipefail
          # Le VPS est mutualisé : chaque projet vit sous /opt/projets/<nom>.
          # Voir /opt/CLAUDE.md sur le serveur.
          cd /opt/projets/kouttab-stock

          # Épingler la version déployée. Le tag précédent est conservé pour
          # permettre un retour arrière (cf. DEPLOIEMENT-VPS.md).
          cp .env .env.precedent
          sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env

          docker compose pull

          # Migrations avant le redémarrage : le nouveau code suppose le
          # nouveau schéma. Conteneur jetable, l'API tourne encore.
          # `-T` et `</dev/null` : SANS EUX, TOUT CE QUI SUIT EST AVALÉ.
          # Ce script est transmis au shell distant par l'entrée standard ;
          # `docker compose run` alloue un TTY et consomme cette même entrée,
          # emportant le reste du fichier. Le déploiement s'arrêtait donc ici,
          # en silence et en succès : `up -d` n'était jamais exécuté, et la
          # production est restée trois versions en arrière sans que rien ne le
          # signale.
          docker compose run --rm -T api alembic upgrade head </dev/null

          # Vestiges d'une recréation interrompue. Compose renomme l'ancien
          # conteneur en `<id>_<nom>` avant de créer le nouveau ; si l'opération
          # casse entre les deux, ce vestige garde le nom réservé et fait
          # échouer toutes les recréations suivantes par « No such container ».
          # C'est ce qui a coupé la production le 2026-08-31.
          orphelins=$(docker ps -a --format '{{.Names}}' | grep -E '^[0-9a-f]{12}_kouttab-stock-' || true)
          if [ -n "$orphelins" ]; then
            echo "Nettoyage des conteneurs orphelins :"
            echo "$orphelins"
            echo "$orphelins" | xargs -r docker rm -f
          fi

          # `up -d` ne doit PAS emporter l'étape. Le 2026-08-31, il est mort sur
          # le worker après avoir recréé l'API et le site : ceux-ci sont restés
          # `Created`, donc éteints, et `set -e` a coupé le script avant la
          # boucle de vérification — celle qui sait justement les relancer. Le
          # site est tombé pour un incident sur un conteneur qui ne sert aucune
          # requête. On note l'échec, la vérification tranche.
          docker compose up -d || echo "AVERTISSEMENT : 'up -d' a échoué, la vérification va reprendre les services." >&2

          # Vérifier que les conteneurs tournent RÉELLEMENT sur l'image
          # attendue. Deux déploiements successifs ont laissé les anciens
          # conteneurs en place : `up -d` avait rendu la main sans les recréer,
          # et le workflow se terminait en succès alors que la version livrée
          # n'avait pas bougé. Le contrôle porte donc sur le résultat, pas sur
          # le code de retour de la commande.
          #
          # `outbox-worker` figure dans la liste depuis le 2026-08-13 : il en
          # était absent, si bien qu'il pouvait disparaître ou rester sur une
          # vieille image sans que rien ne le signale. Or c'est lui qui reprend
          # les envois échoués et déclenche les relances de justificatifs : mort,
          # il ne se voit qu'à l'absence de courriels, des semaines plus tard.
          #
          # Le nom du service et celui du conteneur diffèrent pour lui
          # (`outbox-worker` / `kouttab-stock-outbox`), d'où le couple.
          for couple in api:api web:web outbox-worker:outbox; do
            service="${couple%%:*}"
            nom="kouttab-stock-${couple##*:}"
            # L'ÉTAT autant que l'image. Ce contrôle ne portait que sur
            # `.Config.Image` : un conteneur créé puis jamais démarré le
            # passait haut la main, puisqu'il porte bien la bonne image. C'est
            # exactement l'état dans lequel la production s'est retrouvée le
            # 2026-08-31 — bonne version, éteinte — et le garde-fou censé
            # attraper les déploiements incomplets ne voyait rien.
            etat=$(docker inspect --format '{{.Config.Image}} {{.State.Running}}' "$nom" 2>/dev/null || echo "absent false")
            case "$etat" in
              *"${IMAGE_TAG} true") echo "OK  $nom -> ${IMAGE_TAG}, en marche" ;;
              *)
                echo "ECHEC $nom : '$etat', attendu '${IMAGE_TAG} true'" >&2
                echo "Nouvelle tentative en forçant la recréation." >&2
                docker compose up -d --force-recreate "$service" || true
                etat=$(docker inspect --format '{{.Config.Image}} {{.State.Running}}' "$nom" 2>/dev/null || echo "absent false")
                case "$etat" in
                  *"${IMAGE_TAG} true") echo "OK après recréation : $nom" ;;
                  *) echo "ECHEC définitif sur $nom ($etat)" >&2; exit 1 ;;
                esac
                ;;
            esac
          done

          # Dernier mot : le site répond-il ? Tout le reste peut être vert et la
          # production injoignable — un conteneur « en marche » sur la bonne
          # image peut très bien refuser les requêtes. C'est la seule assertion
          # qui parle le langage du bénévole qui ouvre l'application.
          code=000
          for _ in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://stock.lekouttab.fr/api/v1/health || echo 000)
            [ "$code" = "200" ] && break
            sleep 5
          done
          if [ "$code" != "200" ]; then
            echo "ECHEC : l'API répond $code, le déploiement laisse la production injoignable." >&2
            exit 1
          fi
          echo "OK  https://stock.lekouttab.fr/api/v1/health -> 200"

          # Pas de `docker image prune` : il agit sur TOUTE la machine, qui
          # héberge d'autres projets. Même filtré sur l'ancienneté, il
          # supprimerait leurs images inutilisées — et leur retour arrière avec.
          # Le ménage se fait à la main, en connaissance de cause.
          REMOTE

      - name: Vérifier que le site répond
        run: |
          curl -fsS --retry 6 --retry-delay 5 --retry-connrefused \
            "https://${{ vars.SITE_DOMAIN }}/api/v1/health"
