server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Les en-têtes de sécurité et le TLS sont posés par Caddy, en amont : les
    # dupliquer ici les ferait diverger silencieusement.

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/javascript application/javascript application/json image/svg+xml;

    # Les assets produits par Vite portent un hash dans leur nom : leur contenu
    # ne change jamais à URL constante, on peut donc les mettre en cache
    # définitivement.
    # Un seul en-tête : `expires` en émet déjà un, le cumuler avec `add_header`
    # produisait deux `Cache-Control` que les proxies interprètent inégalement.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html ne doit JAMAIS être mis en cache : c'est lui qui référence les
    # noms hashés. Un index.html périmé pointerait vers des assets supprimés,
    # et l'application afficherait une page blanche après déploiement.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Repli SPA : toutes les routes React (/dashboard, /stock/...) doivent
    # renvoyer index.html, le routage se fait côté client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
